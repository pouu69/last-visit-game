<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>돌아가는 길 · 오브젝트 갤러리</title>
    <style>
      :root{font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#243b37;background:#e4dfc8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,select,input{font:inherit}button,a,select{touch-action:manipulation}button{color:inherit;background:#f5efdb;border:1px solid #a49f86;border-radius:6px;min-height:40px;padding:8px 12px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#486252;color:#fff2c7;border-color:#486252}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9f5844;outline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:20px 26px;border-bottom:1px solid #c3b99c}h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.04em}header p{margin:3px 0 0;color:#586357;font-size:12px}a{color:#486252;text-underline-offset:3px}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);height:calc(100dvh - 91px)}aside{overflow:auto;border-right:1px solid #c3b99c;padding:18px 16px;background:#ede8d3}aside label{display:block;font-size:12px;font-weight:650;margin-bottom:7px}#episode-select,#asset-select{width:100%;color:#243b37;background:#fff8e7;border:1px solid #a49f86;padding:10px;border-radius:5px}#asset-list{display:grid;gap:3px;margin:18px 0}#asset-list button{background:transparent;border-color:transparent;text-align:left;font-size:12px;min-height:35px;padding:7px 10px}#asset-list button:hover{background:#dcd9c1;color:#243b37}#asset-list button[aria-current=true]{background:#486252;color:#fff2c7}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:14px 0}.palette span{height:22px;border:1px solid #243b3720;border-radius:3px}aside p{font-size:11px;color:#626c5e}.workspace{display:grid;grid-template-rows:auto minmax(240px,1fr) auto;min-width:0;min-height:0}.object-heading{padding:20px 24px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}.object-heading h2{font-size:20px;letter-spacing:-.03em;margin:0}.object-heading p{margin:0;font-size:11px;color:#627061}.stage-wrap{position:relative;min-height:0;overflow:hidden}#stage{width:100%;height:100%;min-height:240px;touch-action:none}#stage canvas{display:block;width:100%;height:100%}.stage-note{position:absolute;bottom:12px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;color:#586357;font-size:11px}.stage-note output{font-variant-numeric:tabular-nums}.controls{padding:14px 24px 18px;border-top:1px solid #c3b99c;display:grid;gap:12px;background:#ede8d3}.control-row{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.control-row label,.control-label{font-size:12px;color:#566451;margin-right:4px}.spacer{width:12px}#zoom{width:100px;accent-color:#486252}#camera-readout{font-size:11px;font-variant-numeric:tabular-nums;color:#566451;margin-left:auto}#error{margin:0;padding:10px 24px;color:#8b402f;white-space:pre-wrap}#error:empty{display:none}.control-row button{font-size:12px}.family-name{margin:12px 8px 4px;font-size:11px;font-weight:650;color:#717c69}#metrics{font-size:10px;opacity:.85}@media(max-width:760px){header{padding:15px 16px}header p{display:none}.layout{height:calc(100dvh - 66px);grid-template-columns:1fr}aside{padding:10px 16px;border-right:0;border-bottom:1px solid #c3b99c;overflow:visible}#asset-list,.palette,aside p,aside label{display:none}.layout{grid-template-rows:auto minmax(0,1fr)}.object-heading{padding:12px 16px}.object-heading p{display:none}.controls{padding:12px 16px}.control-row{gap:5px}.control-row button{padding:7px 9px;min-height:38px}#camera-readout{margin-left:0}.stage-note{left:16px;right:16px}.stage-note span{display:none}.spacer{width:3px}}
    </style>
  </head>
  <body>
    <header><div><h1>돌아가는 길 · 오브젝트 갤러리</h1><p>목재 · 녹색 · 황동으로 통일한 저폴리 3D 에셋</p></div><a href="./index.html">게임으로 돌아가기</a></header>
    <div class="layout">
      <aside aria-label="오브젝트 선택"><label for="episode-select">편</label><select id="episode-select" aria-label="갤러리 편 선택"><option value="1">1편 · 박물관</option><option value="2">2편 · 역</option><option value="3">3편 · 극장</option><option value="4">4편 · 수리소</option><option value="5">5편 · 강변</option></select><label for="asset-select">오브젝트</label><select id="asset-select"></select><nav id="asset-list" aria-label="오브젝트 목록"></nav><div class="palette" id="palette" aria-label="공통 색상"></div><p>드래그로 카메라를 돌리고 휠로 확대할 수 있습니다. 뒷면과 상부도 같은 3D 모델에서 렌더링됩니다.</p></aside>
      <main class="workspace"><div class="object-heading"><h2 id="asset-title">오브젝트 준비 중</h2><p id="asset-family"></p></div><div class="stage-wrap"><div id="stage" role="img" aria-label="선택한 오브젝트의 3D 미리보기" tabindex="0"></div><div class="stage-note"><span>드래그 회전 · 휠 확대</span><output id="metrics"></output></div></div><section class="controls" aria-label="미리보기 조작"><div class="control-row"><span class="control-label">회전</span><button id="yaw-left" type="button" aria-label="카메라 왼쪽으로 45도 회전">↶ 45°</button><button id="yaw-right" type="button" aria-label="카메라 오른쪽으로 45도 회전">45° ↷</button><button id="reset" type="button">기본 시점</button><span class="spacer"></span><span class="control-label">높이</span><button type="button" data-pitch="25">25°</button><button type="button" data-pitch="43" aria-pressed="true">43°</button><button type="button" data-pitch="70">70°</button></div><div class="control-row"><button id="autoturn" type="button" aria-pressed="false">자동 회전</button><button id="pause" type="button" aria-pressed="false">일시 정지</button><button id="wireframe" type="button" aria-pressed="false">와이어프레임</button><button id="normals" type="button" aria-pressed="false">법선 보기</button><label for="zoom">확대</label><input type="range" id="zoom" min="0.6" max="1.8" step="0.05" value="1" /><output id="camera-readout"></output></div></section><p id="error" role="alert"></p></main>
    </div>
    <script type="module" src="./asset-gallery.mjs"></script>
  </body>
</html>
